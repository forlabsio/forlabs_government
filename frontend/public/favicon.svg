<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1f2e"/>
      <stop offset="100%" stop-color="#0f1420"/>
    </linearGradient>
    <linearGradient id="drop" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#2d72d2"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Water drop shape (Danbi = 단비 = sweet/precious rain) -->
  <path d="M16 5 C16 5, 10 12, 10 17.5 C10 21.1 12.7 24 16 24 C19.3 24 22 21.1 22 17.5 C22 12 16 5 16 5Z"
        fill="url(#drop)"/>

  <!-- Inner shine on drop -->
  <path d="M14 10 C13 13, 12 15.5, 12.5 18 C13 20 14.5 21.5 16 21.5"
        fill="none" stroke="url(#shine)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Small dots suggesting data/intelligence -->
  <circle cx="8" cy="26" r="1.2" fill="#4facfe" opacity="0.6"/>
  <circle cx="16" cy="28" r="1.2" fill="#4facfe" opacity="0.4"/>
  <circle cx="24" cy="26" r="1.2" fill="#4facfe" opacity="0.6"/>
</svg>
